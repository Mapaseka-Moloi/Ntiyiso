<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ntiyiso · page not found</title>
<link rel="icon" href="/assets/logo.png" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:28px;
       background:#F2F1EF;color:#1F1F1F;
       font-family:'Poppins','Segoe UI',system-ui,-apple-system,Arial,sans-serif;line-height:1.55}
  .card{max-width:520px;width:100%;background:#fff;border:1px solid #E6E4E2;border-radius:14px;padding:28px}
  img{width:56px;height:56px;object-fit:contain;display:block;margin-bottom:18px}
  h1{margin:0 0 8px;font-size:1.4rem;letter-spacing:-.02em}
  p{margin:0 0 10px;color:#6B6B6B;font-size:.94rem}
  code{font-family:ui-monospace,Consolas,monospace;font-size:.85em;background:#F6F5F4;
       border:1px solid #E6E4E2;border-radius:6px;padding:2px 6px}
  .links{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px}
  a.btn{display:inline-block;padding:11px 18px;border-radius:999px;text-decoration:none;font-weight:700;font-size:.88rem}
  a.btn.primary{background:#FF4E00;color:#fff}
  a.btn.ghost{border:1px solid #D2CFCC;color:#1F1F1F}
  #status{margin-top:18px;font-size:.85rem;color:#8A6400}
</style>
</head>
<body>
<div class="card">
  <img src="/assets/logo.png" alt="Ntiyiso" />
  <h1>Page not found</h1>
  <p>We looked for <code id="path">this page</code> and could not find it.</p>
  <div class="links">
    <a class="btn primary" href="/app/check">Open the app</a>
    <a class="btn ghost" href="/auth/login">Sign in</a>
  </div>
  <p id="status"></p>
</div>

<script>
/*
 * Clean-URL fallback.
 *
 * Static hosts that serve this file for unmatched paths (GitHub Pages, S3,
 * plain nginx without the .htaccess rules) can still resolve extensionless
 * links such as "/app/settings" to "/app/settings/index.html". We probe the
 * candidates and redirect to the first one that exists, so the URL in the
 * address bar stays clean.
 */
(function () {
  var path = location.pathname;
  document.getElementById('path').textContent = path;

  // Already handled, or a real file request — nothing to resolve.
  if (/\.[a-z0-9]+$/i.test(path) || path === '/404.html') return;

  var candidates = [path.replace(/\/+$/, '') + '/', path.replace(/\/+$/, '') + '/index.html'];

  (function tryNext(i) {
    if (i >= candidates.length) return;
    var url = candidates[i];
    fetch(url, { method: 'GET', cache: 'no-store' })
      .then(function (res) {
        var type = res.headers.get('content-type') || '';
        if (res.ok && type.indexOf('text/html') !== -1) {
          location.replace(url);
        } else {
          tryNext(i + 1);
        }
      })
      .catch(function () { tryNext(i + 1); });
  })(0);
})();
</script>
</body>
</html>
